<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CollabCanvas – Confirm Delete</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional Google Font (to match other pages) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-gradient: radial-gradient(circle at top left, #f5d0ff, #0f172a);
        --card-bg: rgba(15, 23, 42, 0.94);
        --accent: #6366f1;
        --accent-2: #ec4899;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-subtle: rgba(148, 163, 184, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-gradient);
        color: var(--text-main);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .shell {
        width: 100%;
        max-width: 480px;
        padding: 24px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .nav-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1rem;
      }

      .nav-pill {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: conic-gradient(
          from 180deg,
          #a855f7,
          #ec4899,
          #f97316,
          #22c55e,
          #0ea5e9,
          #a855f7
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: #020617;
        font-size: 0.8rem;
        font-weight: 800;
      }

      .nav-links {
        display: flex;
        gap: 10px;
        font-size: 0.8rem;
      }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 999px;
        transition: background 0.2s, color 0.2s, transform 0.1s;
      }

      .nav-links a:hover {
        background: rgba(15, 23, 42, 0.85);
        color: var(--text-main);
        transform: translateY(-1px);
      }

      .card {
        background: var(--card-bg);
        border-radius: 24px;
        border: 1px solid var(--border-subtle);
        padding: 24px 22px 26px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.7);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 0 16px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .highlight {
        font-weight: 600;
        color: #fed7aa;
      }

      .actions {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 18px;
        border-radius: 999px;
        border: none;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s ease;
      }

      .btn-danger {
        background: linear-gradient(120deg, #ef4444, #f97316);
        color: #020617;
        font-weight: 600;
        box-shadow: 0 12px 30px rgba(248, 113, 113, 0.4);
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-main);
        border: 1px solid rgba(148, 163, 184, 0.7);
      }

      .btn:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .btn:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .status {
        margin-top: 12px;
        font-size: 0.82rem;
        color: var(--text-muted);
        min-height: 1.1em;
      }

      .status.error {
        color: #fecaca;
      }

      .status.success {
        color: #bbf7d0;
      }
    </style>

    <script>
      window.addEventListener("load", () => {
        const params = new URLSearchParams(window.location.search);
        const guestid = params.get("guestid");
        const guestIdSpan = document.getElementById("guest-id");
        const statusEl = document.getElementById("status");
        const confirmBtn = document.getElementById("confirm-btn");
        const cancelBtn = document.getElementById("cancel-btn");

        if (!guestid) {
          guestIdSpan.textContent = "(missing)";
          statusEl.textContent = "No guest ID provided in the URL.";
          statusEl.className = "status error";
          confirmBtn.disabled = true;
          return;
        }

        guestIdSpan.textContent = guestid;

        cancelBtn.addEventListener("click", (e) => {
          e.preventDefault();
          // You can change this to history.back() if you prefer:
          window.location.href = "delete.html";
        });

        confirmBtn.addEventListener("click", async (e) => {
          e.preventDefault();

          statusEl.textContent = "Deleting guest...";
          statusEl.className = "status";

          try {
            const url = "http://localhost:7777/delete/" + encodeURIComponent(guestid);
            const response = await fetch(url, { method: "DELETE" });

            if (!response.ok) {
              throw new Error("Server responded with " + response.status);
            }

            statusEl.textContent = "Guest deleted. Redirecting…";
            statusEl.className = "status success";

            setTimeout(() => {
              window.location.href = "retrieve.html";
            }, 400);
          } catch (err) {
            console.error(err);
            statusEl.textContent =
              "Error deleting guest. Make sure the server is running.";
            statusEl.className = "status error";
          }
        });
      });
    </script>
  </head>

  <body>
    <div class="shell">
      <!-- Top nav -->
      <header class="nav">
        <div class="nav-title">
          <div class="nav-pill">C</div>
          <span>CollabCanvas</span>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="retrieve.html">Retrieve</a>
          <a href="delete.html">Delete list</a>
        </nav>
      </header>

      <!-- Main card -->
      <div class="card">
        <h1>Confirm Delete</h1>
        <p class="subtitle">
          You are about to permanently delete guest with ID
          <span id="guest-id" class="highlight"></span>.
          This action cannot be undone.
        </p>

        <div class="actions">
          <button id
