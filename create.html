<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CollabCanvas – Create Guest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional Google Font (to match index) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-gradient: radial-gradient(circle at top left, #f5d0ff, #0f172a);
        --card-bg: rgba(15, 23, 42, 0.94);
        --accent: #6366f1;
        --accent-2: #ec4899;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-subtle: rgba(148, 163, 184, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-gradient);
        color: var(--text-main);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .shell {
        width: 100%;
        max-width: 520px;
        padding: 24px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .nav-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1rem;
      }

      .nav-pill {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: conic-gradient(
          from 180deg,
          #a855f7,
          #ec4899,
          #f97316,
          #22c55e,
          #0ea5e9,
          #a855f7
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: #020617;
        font-size: 0.8rem;
        font-weight: 800;
      }

      .nav-links {
        display: flex;
        gap: 10px;
        font-size: 0.8rem;
      }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 999px;
        transition: background 0.2s, color 0.2s, transform 0.1s;
      }

      .nav-links a:hover {
        background: rgba(15, 23, 42, 0.85);
        color: var(--text-main);
        transform: translateY(-1px);
      }

      .card {
        background: var(--card-bg);
        border-radius: 24px;
        border: 1px solid var(--border-subtle);
        padding: 24px 22px 26px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.7);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 0 18px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .form-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.85rem;
        color: #e5e7eb;
      }

      input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.7);
        background: rgba(15, 23, 42, 0.7);
        color: var(--text-main);
        font-size: 0.9rem;
      }

      input::placeholder {
        color: rgba(148, 163, 184, 0.9);
      }

      input:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.5);
      }

      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 18px;
        border-radius: 999px;
        border: none;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(120deg, #22c55e, #06b6d4);
        color: #020617;
        font-weight: 600;
        box-shadow: 0 12px 30px rgba(22, 163, 74, 0.4);
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-main);
        border: 1px solid rgba(148, 163, 184, 0.7);
      }

      .btn:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .btn:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .status {
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--text-muted);
        min-height: 1.1em;
      }

      .status.error {
        color: #fecaca;
      }

      .status.success {
        color: #bbf7d0;
      }
    </style>

    <script>
      window.addEventListener("load", () => {
        const form = document.getElementById("create-form");
        const statusEl = document.getElementById("status");

        form.addEventListener("submit", async (event) => {
          event.preventDefault(); // stop normal form submit

          const guestid = document.getElementById("guestid").value.trim();
          const guestname = document.getElementById("guestname").value.trim();
          const guestage = document.getElementById("guestage").value.trim();
          const guestart = document.getElementById("guestart").value.trim();
          const guestexperience = document
            .getElementById("guestexperience")
            .value.trim();

          // Basic validation
          if (!guestid || !guestname) {
            statusEl.textContent = "Guest ID and Name are required.";
            statusEl.className = "status error";
            return;
          }

          const data = {
            guestid: guestid,
            guestname: guestname,
            guestage: guestage,
            guestart: guestart,
            guestexperience: guestexperience,
          };

          statusEl.textContent = "Saving...";
          statusEl.className = "status";

          try {
            const url = "http://localhost:7777/create";
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(data),
            });

            if (!response.ok) {
              throw new Error("Server responded with " + response.status);
            }

            statusEl.textContent = "Guest created successfully! Redirecting…";
            statusEl.className = "status success";

            // small delay so they can see the message
            setTimeout(() => {
              window.location.href = "retrieve.html";
            }, 400);
          } catch (err) {
            console.error(err);
            statusEl.textContent = "Error creating guest. Please try again.";
            statusEl.className = "status error";
          }
        });
      });
    </script>
  </head>

      <header class="nav">
        <div class="nav-title">
          <div class="nav-pill">C</div>

        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="retrieve.html">Retrieve</a>
        </nav>
      </header>

      <!-- Main card -->
      <div class="card">

        <p class="subtitle">
          Add a new creative guest to your collaboration app.
        </p>

              placeholder="e.g. 101"

            />
          </div>

          <div class="form-group">
            <label for="guestname">Name *</label>
            <input
              id="guestname"
              type="text"
              placeholder="e.g. Maya Rivera"
              required
            />
          </div>

            <label for="guesta
